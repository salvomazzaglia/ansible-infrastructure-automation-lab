---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and repository guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: |
          yamllint -c .yamllint playbooks roles inventories meta galaxy.yml requirements.yml

      - name: ansible-lint (production profile)
        run: |
          ansible-lint -c .ansible-lint --profile production playbooks roles

      - name: Playbook syntax checks
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=True
          export ANSIBLE_RETRY_FILES_ENABLED=False
          for pb in playbooks/baseline.yml playbooks/check.yml playbooks/drift.yml \
            playbooks/health.yml playbooks/security.yml playbooks/site.yml playbooks/web.yml
          do
            ansible-playbook --syntax-check -i inventories/synthetic/hosts.yml "$pb"
          done

      - name: Repository guards
        run: python scripts/validate-repository.py

  core-compatibility:
    name: Core ${{ matrix.ansible-core }} / Py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core:
          - "2.20.7"
          - "2.21.2"
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install matrix dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==${{ matrix.ansible-core }}"
          python -m pip install \
            "ansible-lint==26.6.0" \
            "yamllint==1.38.0" \
            "pytest==8.4.1" \
            "jsonschema==4.26.0" \
            "PyYAML==6.0.2"
          ansible-galaxy collection install -r requirements.yml
          python -c "import ansible, sys; print('MATRIX_ANSIBLE_CORE', ansible.__version__); print('MATRIX_PYTHON', sys.version)"

      - name: Collection build
        run: |
          ansible-galaxy collection build --force --output-path dist
          test -n "$(find dist -maxdepth 1 -name 'salvomazzaglia-infrastructure_automation-*.tar.gz')"

      - name: Playbook syntax checks
        run: |
          export ANSIBLE_HOST_KEY_CHECKING=True
          export ANSIBLE_RETRY_FILES_ENABLED=False
          for pb in playbooks/baseline.yml playbooks/check.yml playbooks/drift.yml \
            playbooks/health.yml playbooks/security.yml playbooks/site.yml playbooks/web.yml
          do
            ansible-playbook --syntax-check -i inventories/synthetic/hosts.yml "$pb"
          done

      - name: pytest
        run: python -m pytest -q --tb=short

  molecule:
    name: Molecule (baseline + orchestration)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Molecule and Docker plugin surface
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml -p collections
          python -c "import ansible; print('ansible-core', ansible.__version__)"
          molecule --version
          docker version
          docker info

      - name: Molecule test baseline
        run: |
          set -euo pipefail
          molecule test -s baseline
          echo "BASELINE_MOLECULE_COMPLETE"

      - name: Molecule test orchestration
        run: |
          set -euo pipefail
          molecule test -s orchestration
          echo "ORCHESTRATION_MOLECULE_COMPLETE"

  package:
    name: Collection package artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ansible-core
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core>=2.20.7,<2.22.0"

      - name: Build collection
        run: |
          mkdir -p dist
          ansible-galaxy collection build --force --output-path dist
          ls -la dist/*.tar.gz
          tar -tzf dist/salvomazzaglia-infrastructure_automation-*.tar.gz | head -n 40

      - name: Upload collection artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: salvomazzaglia-infrastructure_automation-collection
          path: dist/salvomazzaglia-infrastructure_automation-*.tar.gz
          if-no-files-found: error
