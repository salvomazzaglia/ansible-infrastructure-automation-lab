---
name: Bug report
description: Report a defect in the Ansible Infrastructure Automation Lab
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this lab. **Do not attach real inventories, credentials, vault passwords, SSH keys, or production host data.**

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Prefer synthetic inventory, Molecule, or local static checks only.
      placeholder: |
        1. python scripts/validate-repository.py
        2. ansible-playbook --syntax-check -i inventories/synthetic/hosts.yml playbooks/check.yml
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Roles / playbooks
        - Inventory / preflight
        - Molecule
        - Callback / reports
        - CI / lint / pytest
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: ansible_core
    attributes:
      label: ansible-core version (if relevant)
      placeholder: "2.20.7 / 2.21.2"

  - type: checkboxes
    id: synthetic
    attributes:
      label: Synthetic data confirmation
      options:
        - label: I confirm this report contains no real inventories, credentials, vault secrets, or SSH key material.
          required: true
