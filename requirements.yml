---
# External collections required for lint/tests.
# Molecule 26.x ansible-native scenarios use community.docker for ephemeral
# container create/destroy (same collection surface as molecule-plugins[docker]).
# Prefer ansible.builtin for role logic; keep this list minimal.
collections:
  - name: community.docker
    version: ">=3.12.0,<5.0.0"
  - name: ansible.posix
    version: ">=1.4.0,<3.0.0"
