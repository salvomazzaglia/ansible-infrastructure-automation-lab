---
# Synthetic lab inventory — deliberately non-routable.
# Hostnames use lab.example.invalid only.
# No ansible_host keys. No RFC1918. No localhost.
# Not intended as a deployment target outside Molecule.

all:
  children:
    bastion:
      hosts:
        ansible-bastion-01.lab.example.invalid:
    web:
      hosts:
        ansible-web-01.lab.example.invalid:
        ansible-web-02.lab.example.invalid:
    application:
      children:
        app:
          hosts:
            ansible-app-01.lab.example.invalid:
    database:
      hosts:
        ansible-db-01.lab.example.invalid:
    monitoring:
      hosts:
        ansible-monitor-01.lab.example.invalid:
