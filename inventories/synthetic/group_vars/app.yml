---
# Application tier overrides — no web frontend on app hosts.

aial_web_manage: false

aial_packages_present:
  - ca-certificates
  - curl
  - gnupg
  - vim-tiny
  - python3

aial_firewall_rules:
  - id: allow-ssh-lab
    direction: inbound
    action: accept
    protocol: tcp
    port: 22
    source: 203.0.113.0/24
    comment: Synthetic lab SSH from documentation TEST-NET-3
  - id: allow-app-internal
    direction: inbound
    action: accept
    protocol: tcp
    port: 8080
    source: 203.0.113.0/24
    comment: Synthetic app listener from documentation TEST-NET-3

aial_health_services: []
aial_health_http_checks: []
aial_health_config_validations: []
