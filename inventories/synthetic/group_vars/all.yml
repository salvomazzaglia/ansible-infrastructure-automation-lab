---
# Shared variables for the synthetic inventory.
# Apply is gated off — public inventory is documentation/planning only.

aial_environment: synthetic
aial_safe_to_apply: false

# common
aial_common_manage_hostname: false
aial_common_timezone: UTC
aial_common_locale: en_US.UTF-8
aial_common_manage_motd: true
aial_common_manage_banner: true

# package_management — present/absent only (never latest)
aial_packages_present:
  - ca-certificates
  - curl
  - gnupg
  - vim-tiny
aial_packages_absent: []
aial_packages_update_cache: true
aial_packages_cache_valid_time: 3600
aial_packages_held: []

# accounts — placeholder keys are never installed by the role
aial_accounts_groups:
  - name: aial_operators
    state: present
    system: false
  - name: aial_auditors
    state: present
    system: false
aial_accounts_users:
  - name: aial_ops
    state: present
    groups:
      - aial_operators
    shell: /bin/bash
    create_home: true
    home: /home/aial_ops
    comment: Synthetic lab operator account
    ssh_authorized_keys:
      - SYNTHETIC_SSH_PUBLIC_KEY_PLACEHOLDER

# time_sync
aial_time_manage: true
aial_time_prefer: auto
aial_time_timezone_hint: UTC
aial_time_ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org

# logging — remote forwarding disabled in synthetic inventory
aial_logging_manage: true
aial_logging_storage: persistent
aial_logging_compress: true
aial_logging_forward_to_remote: false
aial_logging_remote_host: logs.example.invalid

# ssh_hardening — lab-safe defaults
aial_ssh_manage: true
aial_ssh_permit_root_login: prohibit-password
aial_ssh_password_authentication: false
aial_ssh_pubkey_authentication: true
aial_ssh_emergency_compatibility: false

# automatic_updates — no reboot in synthetic lab
aial_autoupdate_manage: true
aial_autoupdate_enabled: true
aial_autoupdate_security_only: true
aial_autoupdate_allow_reboot: false
aial_autoupdate_automatic_reboot: false

# firewall_policy — render/validate only unless explicitly enabled
aial_firewall_manage: true
aial_firewall_apply: false
aial_firewall_default_inbound: drop
aial_firewall_default_outbound: accept

# web_service — disabled fleet-wide; enabled in web group_vars
aial_web_manage: false
aial_web_rolling_enabled: false

# service_health — local checks only
aial_health_manage: true
aial_health_fail_on_error: true
aial_health_services: []
aial_health_http_checks: []
aial_health_expected_files:
  - path: /etc/aial/managed.marker
    state: file
aial_health_config_validations: []
