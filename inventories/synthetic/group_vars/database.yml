---
# Database tier overrides — tight inbound policy, no web service.

aial_web_manage: false

aial_packages_present:
  - ca-certificates
  - curl
  - gnupg
  - vim-tiny

aial_firewall_rules:
  - id: allow-ssh-lab
    direction: inbound
    action: accept
    protocol: tcp
    port: 22
    source: 203.0.113.0/24
    comment: Synthetic lab SSH from documentation TEST-NET-3
  - id: allow-db-app
    direction: inbound
    action: accept
    protocol: tcp
    port: 5432
    source: 203.0.113.0/24
    comment: Synthetic database port from documentation TEST-NET-3

aial_logging_system_max_use: 1G
aial_logging_max_retention_sec: 2592000  # 30 days

aial_health_services: []
aial_health_http_checks: []
aial_health_config_validations: []
