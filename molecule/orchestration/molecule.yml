---
# Molecule 26.x ansible-native scenario: serial web orchestration on ephemeral Docker.
# Two synthetic web targets; pool drain/restore is simulated state only.

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=inventory/
  env:
    ANSIBLE_FORCE_COLOR: "true"
    ANSIBLE_ROLES_PATH: ../../roles
    ANSIBLE_COLLECTIONS_PATH: ../../collections:~/.ansible/collections:/usr/share/ansible/collections
  cfg:
    defaults:
      host_key_checking: true
      retry_files_enabled: false
      interpreter_python: auto_silent
      roles_path: ../../roles
  playbooks:
    create: create.yml
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
    cleanup: cleanup.yml
    destroy: destroy.yml

scenario:
  name: orchestration
  test_sequence:
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
