---
# Ephemeral Molecule inventory — Docker connection only (no SSH).
all:
  children:
    molecule:
      hosts:
        aial-baseline-u2404:
          ansible_connection: docker
          ansible_host: aial-baseline-u2404
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          # Base digest is ubuntu:24.04; create.yml builds a local systemd image FROM this digest.
          aial_molecule_image: "docker.io/library/ubuntu@sha256:561618e2c15bf2397621dd04f96926663a3b5616c189cf7e38db7e82f5c538ea"
          aial_molecule_image_kind: ubuntu_systemd
          aial_molecule_local_image: "aial-molecule-ubuntu2404-systemd:molecule"
          aial_molecule_command: /lib/systemd/systemd
          aial_molecule_privileged: true
          aial_molecule_cgroupns_mode: host
          aial_molecule_volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup:rw
          aial_molecule_tmpfs:
            - /run
            - /run/lock
            - /tmp
        aial-baseline-d12:
          ansible_connection: docker
          ansible_host: aial-baseline-d12
          ansible_user: root
          ansible_python_interpreter: /usr/bin/python3
          # Base digest is debian:12-slim; create.yml builds a local systemd-capable image FROM this digest.
          aial_molecule_image: "docker.io/library/debian@sha256:abd67ffcfa541b485a3dff59865ab629aa048a6c613e639d36e7456b0b229241"
          aial_molecule_image_kind: debian_slim_systemd
          aial_molecule_local_image: "aial-molecule-debian12-systemd:molecule"
          aial_molecule_command: /lib/systemd/systemd
          aial_molecule_privileged: true
          aial_molecule_cgroupns_mode: host
          aial_molecule_volumes:
            - /sys/fs/cgroup:/sys/fs/cgroup:rw
          aial_molecule_tmpfs:
            - /run
            - /run/lock
            - /tmp
