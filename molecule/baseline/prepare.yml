---
# Prepare ephemeral instances: python for Ansible modules, systemd readiness.

- name: Prepare baseline Molecule instances
  hosts: molecule
  gather_facts: false
  become: true
  tasks:
    - name: Check whether python3 is already present
      # intentional: read-only probe; do not report change
      ansible.builtin.raw: command -v python3
      register: aial_molecule_python_check
      changed_when: false
      failed_when: false

    - name: Bootstrap python3 via raw when missing
      ansible.builtin.raw: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq
        apt-get install -y -qq python3 python3-apt sudo ca-certificates
      register: aial_molecule_python_bootstrap
      when: aial_molecule_python_check.rc | default(1) | int != 0
      changed_when: aial_molecule_python_bootstrap.rc | default(1) | int == 0

    - name: Gather facts after python bootstrap
      ansible.builtin.setup:

    - name: Wait for systemd to become available when PID 1 is systemd
      ansible.builtin.systemd:
        name: multi-user.target
      register: aial_molecule_systemd_state
      failed_when: false
      retries: 30
      delay: 2
      until: aial_molecule_systemd_state.status.ActiveState is defined

    - name: Ensure apt cache is usable
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 0

    - name: Install prepare packages for baseline roles
      ansible.builtin.apt:
        name:
          - python3
          - python3-apt
          - sudo
          - ca-certificates
          - openssh-server
          - chrony
          - dbus
        state: present
