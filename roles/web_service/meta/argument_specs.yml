---
argument_specs:
  main:
    short_description: Synthetic nginx demonstration service
    description:
      - Installs nginx and serves a static synthetic demonstration page.
      - Supports rolling deployment pool state simulation variables.
    options:
      aial_web_manage:
        type: bool
        required: false
        default: true
      aial_web_package:
        type: str
        required: false
        default: nginx
      aial_web_service_name:
        type: str
        required: false
        default: nginx
      aial_web_listen_port:
        type: int
        required: false
        default: 80
        description: Listen port in range 1-65535.
      aial_web_root:
        type: str
        required: false
        default: /var/www/aial-synthetic
      aial_web_index_path:
        type: str
        required: false
        default: /var/www/aial-synthetic/index.html
      aial_web_site_config_path:
        type: str
        required: false
        default: /etc/nginx/sites-available/aial-synthetic
      aial_web_site_enabled_path:
        type: str
        required: false
        default: /etc/nginx/sites-enabled/aial-synthetic
      aial_web_remove_default_site:
        type: bool
        required: false
        default: true
      aial_web_page_title:
        type: str
        required: false
        default: ANSIBLE INFRASTRUCTURE AUTOMATION LAB
      aial_web_page_body:
        type: str
        required: false
        default: SYNTHETIC DEMONSTRATION SERVICE
      aial_web_pool_name:
        type: str
        required: false
        default: synthetic-web-pool
      aial_web_pool_member_state:
        type: str
        required: false
        default: in_service
        choices:
          - in_service
          - draining
          - out_of_service
      aial_web_rolling_batch_size:
        type: int
        required: false
        default: 1
      aial_web_rolling_enabled:
        type: bool
        required: false
        default: false
