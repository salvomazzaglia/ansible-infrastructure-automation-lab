---
argument_specs:
  main:
    short_description: Unattended upgrades for Debian/Ubuntu
    description:
      - Configures unattended-upgrades with security-only defaults.
      - No email/SMTP. Never reboots from handlers.
      - Automatic reboot in package config requires allow_reboot and automatic_reboot.
    options:
      aial_autoupdate_manage:
        type: bool
        required: false
        default: true
      aial_autoupdate_enabled:
        type: bool
        required: false
        default: true
      aial_autoupdate_security_only:
        type: bool
        required: false
        default: true
      aial_autoupdate_allow_reboot:
        type: bool
        required: false
        default: false
        description: Must be true (with automatic_reboot) before reboot policy is written as true.
      aial_autoupdate_automatic_reboot:
        type: bool
        required: false
        default: false
      aial_autoupdate_automatic_reboot_time:
        type: str
        required: false
        default: "02:00"
      aial_autoupdate_remove_unused_kernel:
        type: bool
        required: false
        default: true
      aial_autoupdate_remove_unused_dependencies:
        type: bool
        required: false
        default: true
      aial_autoupdate_mail_report:
        type: bool
        required: false
        default: false
      aial_autoupdate_report_path:
        type: str
        required: false
        default: /var/log/aial/unattended-upgrades-report.txt
      aial_autoupdate_periodic_path:
        type: str
        required: false
        default: /etc/apt/apt.conf.d/20auto-upgrades
      aial_autoupdate_unattended_path:
        type: str
        required: false
        default: /etc/apt/apt.conf.d/50unattended-upgrades-aial
      aial_autoupdate_package_name:
        type: str
        required: false
        default: unattended-upgrades
