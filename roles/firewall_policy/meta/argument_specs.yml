---
argument_specs:
  main:
    short_description: Declarative firewall policy with validation
    description:
      - Validates and renders firewall rules.
      - Applies only when aial_firewall_apply is true.
      - Rejects malformed ports, protocols, RFC1918 sources, duplicate IDs, and implicit allow-all.
    options:
      aial_firewall_manage:
        type: bool
        required: false
        default: true
      aial_firewall_apply:
        type: bool
        required: false
        default: false
      aial_firewall_backend:
        type: str
        required: false
        default: nftables
        choices:
          - nftables
          - iptables-restore
      aial_firewall_policy_path:
        type: str
        required: false
        default: /etc/aial/firewall/policy.nft
      aial_firewall_rendered_path:
        type: str
        required: false
        default: /etc/aial/firewall/rendered.nft
      aial_firewall_state_path:
        type: str
        required: false
        default: /etc/aial/firewall/last-validated.json
      aial_firewall_default_inbound:
        type: str
        required: false
        default: drop
        choices:
          - accept
          - drop
          - reject
      aial_firewall_default_outbound:
        type: str
        required: false
        default: accept
        choices:
          - accept
          - drop
          - reject
      aial_firewall_reject_implicit_allow_all:
        type: bool
        required: false
        default: true
      aial_firewall_allowed_protocols:
        type: list
        elements: str
        required: false
      aial_firewall_rules:
        type: list
        elements: dict
        required: false
        options:
          id:
            type: str
            required: true
          direction:
            type: str
            required: true
            choices:
              - inbound
              - outbound
          action:
            type: str
            required: true
            choices:
              - accept
              - drop
              - reject
          protocol:
            type: str
            required: true
            choices:
              - tcp
              - udp
              - icmp
          port:
            type: int
            required: false
            description: TCP/UDP port in range 1-65535.
          source:
            type: str
            required: true
            description: any, documentation CIDR, or *.example.invalid — never RFC1918.
          comment:
            type: str
            required: false
